apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kubernetes-saisha-frontend:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: "http://backend-service:5000"
          ports:
            - containerPort: 3000